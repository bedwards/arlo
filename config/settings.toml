[database]
postgres_url = "postgresql://localhost/arlo"
duckdb_path = "data/arlo.duckdb"

[ingest]
chunk_size = 2000
chunk_overlap = 200
embedding_model = "all-MiniLM-L6-v2"
embedding_dimension = 384

[trade]
bankroll = 1000.0
max_position_pct = 0.05
max_exposure_pct = 0.30
kelly_fraction = 0.25
daily_loss_limit_pct = 0.03
min_edge = 0.10

[claude]
model = "claude-opus-4-6"
