[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arlo"
version = "0.1.0"
description = "Arlo: Competitive AI Superforecasting System for Analysis, Navigation, Discovery, Research, and Action"
requires-python = ">=3.12"
dependencies = [
    # Core
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.5",
    "tomli>=2.0",
    "python-dotenv>=1.0",

    # Database
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # Data processing
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",

    # Visualization
    "altair>=5.3",
    "vl-convert-python>=1.3",
    "plotly>=5.22",

    # NLP / ML
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "hdbscan>=0.8",
    "networkx>=3.3",
    "pgmpy>=0.0.1",

    # Web / Scraping
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "yt-dlp>=2024.0",

    # Time series forecasting
    "statsforecast>=1.7",

    # APIs
    "anthropic>=0.34",

    # Trading
    "kalshi-python>=2.1",
    "cryptography>=41.0",

    # PDF
    "pymupdf>=1.24",

    # Utilities
    "python-dateutil>=2.9",
    "tenacity>=8.5",
    "structlog>=24.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
ibkr = [
    # ibapi must be installed manually from IBKR TWS API distribution
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
arlo = "arlo.cli:_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
